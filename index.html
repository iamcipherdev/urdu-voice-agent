<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Urdu Voice Agent — AI Assistant</title>
<meta name="description" content="Urdu me baat karne wala AI voice assistant. Bolo, suno, jawab pao.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--card:#161d27;--accent:#22c55e;--accent2:#16a34a;--text:#e8eef4;--muted:#8b98a8;--gold:#d4a94e}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
header{text-align:center;padding:26px 16px 10px}
header h1{font-size:1.5rem;font-weight:700}
header h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:.85rem;margin-top:4px}
#orb-wrap{display:flex;justify-content:center;padding:26px 0 10px}
#orb{width:170px;height:170px;border-radius:50%;position:relative;cursor:pointer;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,#1f2b3a,#10151d);border:2px solid #232f3f;transition:.3s;user-select:none}
#orb .mic{font-size:3rem;z-index:2}
#orb.idle{border-color:#2c3a4e}
#orb.listening{border-color:var(--accent);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:ring 1.4s infinite}
#orb.thinking{border-color:var(--gold);animation:spin 1.2s linear infinite}
#orb.speaking{border-color:var(--accent);animation:beat 1s infinite}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes spin{to{filter:hue-rotate(360deg)}}
#status{text-align:center;min-height:28px;color:var(--muted);font-size:.95rem;padding:0 20px}
#status b{color:var(--text)}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:.95rem;line-height:1.65;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.msg.user{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid #232f3f;border-bottom-left-radius:4px}
.msg.bot .who{font-size:.7rem;color:var(--gold);font-weight:700;margin-bottom:4px;letter-spacing:.05em}
#controls{display:flex;gap:10px;justify-content:center;padding:14px 16px 26px;flex-wrap:wrap}
button.pill{background:var(--card);color:var(--text);border:1px solid #2c3a4e;padding:11px 22px;border-radius:999px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s}
button.pill:hover{border-color:var(--accent)}
button.pill.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.big{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:15px 44px;border-radius:999px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 8px 28px rgba(34,197,94,.35);transition:.2s}
button.big:active{transform:scale(.96)}
.hint{text-align:center;color:var(--muted);font-size:.78rem;padding:0 24px 18px;max-width:520px;margin:0 auto;line-height:1.7}
footer{text-align:center;color:#3d4a5c;font-size:.72rem;padding:14px}
</style>
</head>
<body>

<header>
  <h1>🎙️ <span>Urdu</span> Voice Agent</h1>
  <p>AI assistant jo Urdu me sunta aur bolta hai</p>
</header>

<div id="orb-wrap">
  <div id="orb" class="idle"><span class="mic">🎤</span></div>
</div>
<div id="status">Neeche button dabao aur bolo…</div>

<div id="chat"></div>

<div id="controls">
  <button class="big" id="talkBtn">🗣️ Baat Karo</button>
</div>
<div id="controls" style="padding-top:0">
  <button class="pill on" id="autoBtn">🔁 Auto-continue: ON</button>
  <button class="pill" id="clearBtn">🗑️ Saaf karo</button>
</div>

<p class="hint">Chrome / Android par behtareen chalta hai. Mic ki ijazat dena paregi. Jawab Urdu awaz me sunai dega. Ye demo prototype hai — free APIs par chalta hai.</p>
<footer>Built by Cipher · Urdu Voice Agent v1</footer>

<script>
const SYSTEM = "Tum ek dostana Urdu voice assistant ho jise 'Urdu Voice Agent' kehte hain. Hamesha URDU SCRIPT me jawab do. Sirf 2-4 jumle — chhota, natural, bolne layak jawab (voice ke liye). Koi markdown, koi lambe paragraph nahi. Sawal ka seedha jawab do, phir halka follow-up ya dilchasp baat.";
let history = []; // {q, a} pairs, last 3 kept
let autoContinue = true;
let recognizing = false;
let speaking = false;

const orb = document.getElementById('orb');
const statusEl = document.getElementById('status');
const chatEl = document.getElementById('chat');
const talkBtn = document.getElementById('talkBtn');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  setStatus('❌ Tumhara browser voice input support nahi karta. Chrome use karo.');
  talkBtn.disabled = true;
}
const rec = SR ? new SR() : null;
if (rec) {
  rec.lang = 'ur-PK';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
}

function setStatus(html){ statusEl.innerHTML = html; }
function setOrb(cls){ orb.className = cls; }
function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = who === 'bot' ? '<div class="who">🤖 AGENT</div>' + escapeHtml(text) : escapeHtml(text);
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// Pick best Urdu TTS voice
function urduVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==='ur-PK') || vs.find(v=>v.lang && v.lang.startsWith('ur')) || vs.find(v=>v.lang==='hi-IN') || null;
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

function speak(text){
  return new Promise(resolve=>{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ur-PK'; u.rate = 0.95; u.pitch = 1;
    const v = urduVoice(); if (v) u.voice = v;
    speaking = true; setOrb('speaking'); setStatus('🔊 <b>Bol raha hai…</b>');
    u.onend = ()=>{ speaking=false; resolve(); };
    u.onerror = ()=>{ speaking=false; resolve(); };
    speechSynthesis.speak(u);
  });
}

async function askAgent(question){
  setOrb('thinking'); setStatus('🤔 <b>Soch raha hai…</b>');
  // include last 3 exchanges as context
  let ctx = history.slice(-3).map(h=>'User: '+h.q+'\nAssistant: '+h.a).join('\n');
  let prompt = question;
  if (ctx) prompt = 'Pichli guftagu:\n'+ctx+'\n\nNaya sawal: '+question;
  const url = 'https://text.pollinations.ai/'+encodeURIComponent(prompt)
    + '?system='+encodeURIComponent(SYSTEM)+'&model=openai';
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('api');
    let t = (await r.text()).trim();
    t = t.replace(/^["']|["']$/g,'').slice(0, 600);
    return t || 'Maazrat, samajh nahi aaya. Dobara kaho.';
  }catch(e){
    return 'Internet me masla lag raha hai. Thori der baad try karo.';
  }
}

function startListening(){
  if(!rec || recognizing || speaking) return;
  recognizing = true;
  setOrb('listening'); setStatus('🎤 <b>Sun raha hun… bolo!</b>');
  rec.start();
}

if (rec){
  rec.onresult = async (e)=>{
    recognizing = false;
    const text = e.results[0][0].transcript.trim();
    if(!text){ setOrb('idle'); setStatus('Kuch sunai nahi diya — dobara try karo.'); return; }
    addMsg(text,'user');
    const answer = await askAgent(text);
    history.push({q:text,a:answer});
    addMsg(answer,'bot');
    await speak(answer);
    setOrb('idle');
    if(autoContinue){ setStatus('Neeche button dabao ya khud-ba-khud sununga…'); setTimeout(()=>{ if(autoContinue && !speaking) startListening(); }, 800); }
    else setStatus('Neeche button dabao aur bolo…');
  };
  rec.onerror = (e)=>{
    recognizing = false; setOrb('idle');
    if(e.error==='not-allowed') setStatus('❌ Mic ki ijazat nahi mili — browser settings me allow karo.');
    else if(e.error==='no-speech') setStatus('Kuch sunai nahi diya — dobara try karo.');
    else setStatus('Mic me masla: '+e.error);
  };
  rec.onend = ()=>{ recognizing = false; if(orb.className==='listening'){ setOrb('idle'); setStatus('Neeche button dabao aur bolo…'); } };
}

talkBtn.onclick = ()=>{ speechSynthesis.cancel(); speaking=false; startListening(); };
orb.onclick = ()=>{ speechSynthesis.cancel(); speaking=false; startListening(); };
document.getElementById('autoBtn').onclick = function(){
  autoContinue = !autoContinue;
  this.textContent = autoContinue ? '🔁 Auto-continue: ON' : '🔁 Auto-continue: OFF';
  this.classList.toggle('on', autoContinue);
};
document.getElementById('clearBtn').onclick = ()=>{ chatEl.innerHTML=''; history=[]; setStatus('Guftagu saaf ho gayi. Neeche button dabao aur bolo…'); };
</script>
</body>
</html>
